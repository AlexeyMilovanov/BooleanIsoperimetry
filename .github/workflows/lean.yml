name: Lean

on:
  push:
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: HarperStability
      - name: Strict audit (no sorry, clean axioms, frozen interface)
        env:
          STRICT_NO_SORRY: "1"
          STRICT_AXIOMS: "1"
          STRICT_INTERFACE_HASH: "1"
        run: bash scripts/audit.sh
